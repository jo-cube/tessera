# A new `vX.Y.Z` tag publishes a GitHub Release once the tagged commit passes
# every check. Manual dispatch prepares and verifies a ref without publishing.
# See docs/releases.md.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to prepare and verify without publishing
        type: string
        required: true
        default: main

permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # Tag updates and deletions are not releases.
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag and resolve the candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/release.py check-tag --tag "$RELEASE_TAG" --revision "$GITHUB_SHA"
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      package: true

  publish:
    if: github.event_name == 'push' && github.event.created
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          python3 scripts/release.py publish --tag "$RELEASE_TAG" \
            --revision "$RELEASE_REVISION" --crate "dist/tessera-${RELEASE_TAG#v}.crate"
