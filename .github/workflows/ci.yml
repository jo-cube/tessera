# `checks` runs `just all`, the repository's whole check list, on Linux. The
# platform jobs then run the tests and a release build of that same revision on
# every supported host, and `msrv` proves the minimum Rust version. Release
# runs this workflow through `workflow_call` with `package: true`.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check; the triggering commit when empty
        type: string
        default: ''
      package:
        description: Upload the .crate as an artifact
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '2'

jobs:
  checks:
    name: just all
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve candidate revision
        id: revision
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master, 2026-07-16
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: checks
      - run: just all
      - name: Upload the .crate
        if: inputs.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: target/package/tessera-*.crate
          if-no-files-found: error
          retention-days: 14

  platforms:
    name: ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # Every runner has a C compiler, which the bundled Zstandard needs.
        # Windows is not supported: see docs/releases.md.
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master, 2026-07-16
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - run: just test
      - run: just build

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # The rust-version in Cargo.toml; `just msrv` selects it with `cargo +`.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master, 2026-07-16
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: msrv
      - run: just msrv
