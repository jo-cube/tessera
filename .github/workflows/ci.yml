# The checks of `scripts/validate.sh check` on hosted runners, without its
# container: one job per platform on the pinned toolchain, and one on the
# minimum supported Rust version. Benchmarks, the large-allocation tests and
# the RocksDB comparison stay local and opt-in.
name: ci

# Pushes to the long-lived branches and release tags, and pull requests, so
# that a pull request's branch does not run twice. Hosted minutes in a
# private repository are billed, macOS at a multiple of Linux.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TEST_THREADS: "2"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64, Linux arm64 and macOS arm64. Each runner has a C
        # compiler, which the bundled Zstandard needs.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release --lib --examples

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.89.0, the rust-version in Cargo.toml
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - run: cargo +1.89.0 check --locked --all-targets --all-features
      - run: cargo +1.89.0 clippy --locked --all-targets --all-features -- -D warnings
