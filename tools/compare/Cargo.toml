# Tessera against RocksDB on identical data and operations. A separate
# package so that RocksDB, linked from the system library in
# tools/compare/Dockerfile, never enters Tessera's dependency graph.
[package]
name = "tessera-compare"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tessera = { path = "../.." }
