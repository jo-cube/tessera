[package]
name = "tessera"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
description = "A RAM-first, compressed LSM key-value database"
license = "MIT"
repository = "https://github.com/jo-cube/tessera"
readme = "README.md"
# A private alpha: depended on by path or Git revision, not from crates.io.
# There is no hosted documentation; `cargo doc --open` builds it.
publish = false

[dependencies]
crc32fast = "1"
zstd-safe = { version = "8", default-features = false, features = ["std", "vendored"] }

# Tests run in a container and are not stepped through in a debugger, so
# line tables, which keep file and line numbers in panics and backtraces,
# are enough. Full debug info made each test binary, which every rebuild
# writes again, 30–65% larger (the unit-test binary 33 MiB against 20 MiB).
[profile.dev]
debug = "line-tables-only"