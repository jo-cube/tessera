[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
description = "A RAM-first, compressed LSM key-value database"
license = "MIT"
publish = false

[features]
# Read-only access to engine internals for the benchmarks that measure them.
# Not part of the supported API.
diagnostics = []

[dependencies]
crc32fast = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode"] }
zstd-safe = { version = "8", default-features = false, features = ["std", "vendored"] }
