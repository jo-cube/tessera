[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
description = "A RAM-first, compressed LSM key-value database"
license = "MIT"
publish = false

[dependencies]
crc32fast = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode"] }
zstd-safe = { version = "8", default-features = false, features = ["std", "vendored", "zdict_builder"] }

# Research only (5AB, 5AD; `run::tests::layouts`): dictionaries by reference,
# for test builds. The same package; production builds keep it off.
[dev-dependencies]
zstd-safe = { version = "8", default-features = false, features = ["std", "vendored", "zdict_builder", "experimental"] }

# Tests run in a container and are not stepped through in a debugger, so
# line tables, which keep file and line numbers in panics and backtraces,
# are enough. Full debug info made each test binary, which every rebuild
# writes again, 30–65% larger (the unit-test binary 33 MiB against 20 MiB).
[profile.dev]
debug = "line-tables-only"
